<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #17171a;
      --ink-soft: #52535a;
      --ink-dim: #92939a;
      --ink-faint: #c8c9cd;
      --rule: #ececec;
      --accent: #17171a;
      --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --sans: 'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); min-height: 100vh; }
    body {
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.75rem;
    }
    .shell { text-align: center; max-width: 30rem; width: 100%; }
    .code {
      font-family: var(--mono);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ink-dim);
      font-weight: 500;
      margin-bottom: 18px;
    }
    h1 {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 36px;
      letter-spacing: -0.028em;
      line-height: 1.1;
      margin: 0 0 14px;
    }
    p.sub {
      font-size: 16px;
      color: var(--ink-soft);
      line-height: 1.55;
      margin: 0 0 32px;
    }
    .cta-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--rule);
      color: var(--ink);
      font-family: var(--sans);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    a.button:hover { border-color: var(--ink); }
    a.button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    a.button.primary:hover { opacity: 0.9; }
    .button .arrow { font-family: var(--mono); font-weight: 400; color: var(--ink-faint); }
    .button.primary .arrow { color: rgba(255, 255, 255, 0.5); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="code">Error 500</div>
    <h1>Something went wrong.</h1>
    <p class="sub">We're looking into it. Please try again in a moment.</p>
    <div class="cta-row">
      <a href="javascript:location.reload()" class="button primary">Try again <span class="arrow">↻</span></a>
      <a href="/" class="button">Go home</a>
    </div>
  </div>
</body>
</html>
